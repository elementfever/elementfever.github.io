<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Balloon Pop Party</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{
  --sky-top:#7cc8ff; --sky-bot:#d8f1ff; --ink:#1f3a5c; --sun:#ffd23f; --grass:#6fcf6a; --white:#ffffff;
  --display:"Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  color-scheme: light;
}
html,body{height:100%;overflow:hidden;background:var(--sky-bot);color:var(--ink)}
body{font-family:var(--display);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--sky-top),var(--sky-bot));text-align:center;z-index:2}
#start h1{margin:0;font-size:clamp(40px,10vw,88px);line-height:1;font-weight:800;text-wrap:balance;color:var(--white);
  text-shadow:0 4px 0 var(--ink)}
#go{font-family:var(--display);font-weight:800;font-size:clamp(32px,8vw,56px);color:var(--ink);background:var(--sun);
  border:6px solid var(--ink);border-radius:999px;padding:16px 56px;cursor:pointer;box-shadow:0 8px 0 var(--ink);
  animation:bob 1.4s ease-in-out infinite}
#go:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
#go:focus-visible{outline:5px dashed var(--white);outline-offset:6px}
#start p{margin:0;font-size:18px;font-weight:600;max-width:32ch;color:var(--ink)}
@keyframes bob{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){#go{animation:none}}
</style>

<canvas id="c"></canvas>
<div id="start">
  <h1>Balloon Pop!</h1>
  <button id="go" type="button">Play ▶</button>
  <p>Tap the balloons to pop them. Tap the sky to make a new one. Turn the sound up!</p>
</div>

<a href="./" style="position:fixed;z-index:9;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-family:'Baloo 2','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:16px;color:#2b1d12;background:#fff6e3;border:3px solid #2b1d12;border-radius:999px;padding:6px 14px;text-decoration:none;opacity:.92">⌂ Home</a>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

const COLORS=[
  {name:'Red',c:'#ff4d5e',note:262},{name:'Orange',c:'#ff9a2e',note:294},{name:'Yellow',c:'#ffd23f',note:330},
  {name:'Green',c:'#3ccf6e',note:349},{name:'Blue',c:'#3b8bff',note:392},{name:'Purple',c:'#a066ff',note:440},
  {name:'Pink',c:'#ff7ac8',note:494}
];
const balloons=[],bits=[],clouds=[];
let started=false,actx=null,pops=0;
for(let i=0;i<5;i++)clouds.push({x:Math.random()*1.2,y:.08+Math.random()*.45,s:.6+Math.random()*.8,v:.00004+Math.random()*.00006});

function size(){return Math.max(70,Math.min(W,H)*.14)}
function spawn(x,y){
  const r=size()*(0.9+Math.random()*.25),col=COLORS[Math.floor(Math.random()*COLORS.length)];
  balloons.push({x:x??(r+Math.random()*(W-2*r)),y:y??H+r*1.4,r,col,vy:.35+Math.random()*.35,ph:Math.random()*6.28,face:Math.random()<.5,scale:y?0:1});
}

function sound(freq){
  if(!actx)return;const t=actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';
  o.frequency.setValueAtTime(freq*2,t);o.frequency.exponentialRampToValueAtTime(freq,t+.12);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.4);
  o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.45);
  const n=actx.createBufferSource(),b=actx.createBuffer(1,actx.sampleRate*.06,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
  const ng=actx.createGain();ng.gain.value=.25;n.buffer=b;n.connect(ng).connect(actx.destination);n.start(t);
}
function say(word){
  try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.rate=.9;u.pitch=1.4;speechSynthesis.speak(u)}catch(e){}
}
function boop(){if(!actx)return;const t=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();o.type='sine';
  o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(900,t+.15);
  g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.3)}

function pop(b,i){
  balloons.splice(i,1);pops++;
  sound(b.col.note);say(b.col.name);
  for(let k=0;k<26;k++){const a=Math.random()*6.28,s=2+Math.random()*6;
    bits.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,life:1,c:k%3?b.col.c:COLORS[k%7].c,star:k%4===0,r:6+Math.random()*8,rot:Math.random()*6})}
  bits.push({word:b.col.name,x:b.x,y:b.y,vx:0,vy:-1.2,life:1.4,c:b.col.c});
  if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
}

cv.addEventListener('pointerdown',e=>{
  if(!started)return;const x=e.clientX,y=e.clientY;
  for(let i=balloons.length-1;i>=0;i--){const b=balloons[i];
    if(Math.hypot(x-b.x,y-b.y)<b.r*1.35){pop(b,i);return}}
  spawn(x,y);boop();
});

document.getElementById('go').addEventListener('click',()=>{
  try{actx=new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
  started=true;document.getElementById('start').hidden=true;
  for(let i=0;i<4;i++)spawn(undefined,H*(.4+i*.18));
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
});

function cloud(x,y,s){ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();
  [[0,0,40],[35,-15,45],[75,0,38],[38,12,40]].forEach(([dx,dy,r])=>{ctx.moveTo(x+dx*s+r*s,y+dy*s);ctx.arc(x+dx*s,y+dy*s,r*s,0,6.28)});ctx.fill()}

function drawBalloon(b){
  const {x,y,r}=b,s=b.scale;ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.strokeStyle='rgba(31,58,92,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,r*1.15);
  ctx.bezierCurveTo(r*.25,r*1.5,-r*.25,r*1.8,0,r*2.2);ctx.stroke();
  ctx.fillStyle=b.col.c;ctx.beginPath();ctx.moveTo(-r*.12,r*1.2);ctx.lineTo(r*.12,r*1.2);ctx.lineTo(0,r*1.05);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,r,r*1.15,0,0,6.28);ctx.fill();
  ctx.lineWidth=4;ctx.strokeStyle='rgba(31,58,92,.25)';ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-r*.38,-r*.45,r*.16,r*.3,-.5,0,6.28);ctx.fill();
  if(b.face){ctx.fillStyle='#1f3a5c';
    ctx.beginPath();ctx.arc(-r*.3,-r*.05,r*.09,0,6.28);ctx.arc(r*.3,-r*.05,r*.09,0,6.28);ctx.fill();
    ctx.strokeStyle='#1f3a5c';ctx.lineWidth=Math.max(3,r*.06);ctx.lineCap='round';ctx.beginPath();ctx.arc(0,r*.15,r*.28,.2,Math.PI-.2);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(-r*.5,r*.2,r*.1,0,6.28);ctx.arc(r*.5,r*.2,r*.1,0,6.28);ctx.fill()}
  ctx.restore();
}
function star(x,y,r,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();
  for(let i=0;i<10;i++){const a=i*Math.PI/5,rr=i%2?r*.45:r;ctx.lineTo(Math.sin(a)*rr,-Math.cos(a)*rr)}ctx.closePath();ctx.fill();ctx.restore()}

let last=performance.now();
function frame(now){
  const dt=Math.min(3,(now-last)/16.67);last=now;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#7cc8ff');g.addColorStop(1,'#d8f1ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(W-70,70,44,0,6.28);ctx.fill();
  clouds.forEach(c=>{c.x+=c.v*dt*16;if(c.x>1.25)c.x=-.25;cloud(c.x*W,c.y*H,c.s)});
  ctx.fillStyle='#6fcf6a';ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=40)ctx.lineTo(x,H-28-Math.sin(x*.02)*8);ctx.lineTo(W,H);ctx.fill();

  if(started){
    if(balloons.length<5&&Math.random()<.02*dt)spawn();
    for(let i=balloons.length-1;i>=0;i--){const b=balloons[i];
      b.scale=Math.min(1,b.scale+.06*dt);b.ph+=.03*dt;b.y-=b.vy*dt;b.x+=Math.sin(b.ph)*.6*dt;
      if(b.y<-b.r*3)balloons.splice(i,1);else{ctx.fillStyle=b.col.c;drawBalloon(b)}}
  }
  for(let i=bits.length-1;i>=0;i--){const p=bits[i];p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.word){p.life-=.012*dt;ctx.globalAlpha=Math.max(0,Math.min(1,p.life));ctx.font=`800 ${Math.round(size()*.7)}px ${getComputedStyle(document.documentElement).getPropertyValue('--display')}`;
      ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#ffffff';ctx.strokeText(p.word,p.x,p.y);ctx.fillStyle=p.c;ctx.fillText(p.word,p.x,p.y)}
    else{p.vy+=.18*dt;p.life-=.018*dt;p.rot+=.1*dt;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;
      if(p.star)star(p.x,p.y,p.r,p.rot);else{ctx.beginPath();ctx.arc(p.x,p.y,p.r*.5,0,6.28);ctx.fill()}}
    ctx.globalAlpha=1;if(p.life<=0)bits.splice(i,1)}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>

</body></html>
