<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playground</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
:root{
  --bg:#fff6e6; --ink:#2b1d12; --muted:#7a6552; --card:#ffffff;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display)}
.wrap{max-width:900px;margin:0 auto;padding:max(24px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 48px max(18px,env(safe-area-inset-left,0px))}
header{text-align:center;margin:12px 0 28px}
h1{margin:0;font-size:clamp(44px,10vw,80px);line-height:.95;font-weight:800;text-shadow:0 4px 0 #f2c14e}
header p{margin:10px 0 0;font-size:19px;font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
a.tile{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);
  border:5px solid var(--ink);border-radius:26px;padding:18px 20px 20px;box-shadow:0 8px 0 var(--ink);
  transition:transform .12s, box-shadow .12s}
a.tile:hover{transform:translateY(-3px);box-shadow:0 11px 0 var(--ink)}
a.tile:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ink)}
a.tile:focus-visible{outline:4px dashed var(--ink);outline-offset:6px}
.emoji{width:84px;height:84px;border-radius:22px;display:grid;place-items:center;font-size:48px;background:var(--c);border:4px solid var(--ink)}
.tile h2{margin:6px 0 0;font-size:28px;line-height:1.05;font-weight:800}
.tile span{font-size:16px;font-weight:600;color:var(--muted);line-height:1.3}
.soon{border-style:dashed;box-shadow:none;opacity:.6;pointer-events:none}
footer{text-align:center;margin-top:34px;color:var(--muted);font-weight:600;font-size:14px}
@media (prefers-reduced-motion:reduce){a.tile{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Playground</h1>
    <p>Pick something to play</p>
  </header>
  <main class="grid" id="grid"></main>
  <footer>More coming soon</footer>
</div>
<script>
// To add something new: add one line to this list and upload its file.
const ITEMS = [
  { title: "Safari Peekaboo", emoji: "🦁", color: "#ffd27a", file: "safari.html", blurb: "Tap the grass and animals pop up to say hello" },
  { title: "Balloon Pop", emoji: "🎈", color: "#9fd8ff", file: "balloons.html", blurb: "Pop balloons and hear their colours" },
  { title: "Tap and Find", emoji: "🐮", color: "#b8ecc9", file: "tapfind.html", blurb: "Find the animal, colour, shape or number" },
  { title: "Beep Beep Road", emoji: "🚗", color: "#ffc4cf", file: "beepbeep.html", blurb: "Drive, collect goodies and stop at red lights" },
  { title: "Wellerman Sea Song", emoji: "⛵", color: "#ffd9a8", file: "wellerman.html", blurb: "Sail along to the sea shanty and tap for whales" },
  { title: "Important stuff", emoji: "🔒", color: "#d6dde8", file: "important.html", blurb: "Sign in required" },
];

const grid = document.getElementById("grid");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
grid.innerHTML = ITEMS.map(i =>
  '<a class="tile" href="' + esc(i.file) + '">' +
    '<div class="emoji" style="--c:' + esc(i.color) + '">' + i.emoji + '</div>' +
    '<h2>' + esc(i.title) + '</h2>' +
    '<span>' + esc(i.blurb) + '</span>' +
  '</a>'
).join("") +
  '<div class="tile soon" aria-hidden="true" style="display:flex;flex-direction:column;gap:6px;background:transparent;border:5px dashed var(--muted);border-radius:26px;padding:18px 20px 20px">' +
    '<div class="emoji" style="--c:transparent;border-style:dashed;border-color:var(--muted)">＋</div>' +
    '<h2 style="color:var(--muted)">Next one</h2><span>Coming soon</span></div>';
</script>
</body>
</html>
