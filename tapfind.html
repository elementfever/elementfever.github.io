<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tap and Find</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --bg:#FFF6E0; --fg:#2B2240; --soft:#7A6E8F; --card:#FFFFFF; --edge:#2B2240;
  --sun:#FFC83D; --leaf:#3FBF7F; --sky:#3E8EF7; --berry:#E8476A;
  --display:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1A2E;--fg:#FFF6E0;--soft:#B9AFCB;--card:#2E2844;--edge:#0E0B18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E1A2E;--fg:#FFF6E0;--soft:#B9AFCB;--card:#2E2844;--edge:#0E0B18;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:12px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:14px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sky);outline-offset:4px}

.worlds{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.world{border:3px solid var(--edge);background:var(--card);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--edge)}
.world[aria-pressed="true"]{background:var(--sun);color:#2B2240}
.world:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}

.prompt{display:flex;align-items:center;justify-content:center;gap:12px;min-height:4.2rem}
.prompt h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3.4rem);margin:0;text-align:center;text-wrap:balance;line-height:1.05}
.say{width:3.4rem;height:3.4rem;flex:none;border-radius:50%;border:3px solid var(--edge);background:var(--sky);box-shadow:0 4px 0 var(--edge);display:grid;place-items:center}
.say svg{width:1.7rem;height:1.7rem;fill:#fff}

.board{flex:1;min-height:0;display:grid;gap:clamp(12px,3vw,24px);grid-template-columns:repeat(var(--n,2),1fr);align-items:center;max-width:900px;width:100%;margin-inline:auto}
@media (max-width:560px) and (orientation:portrait){.board{grid-template-columns:1fr;grid-auto-rows:1fr;align-items:stretch}}
.tile{aspect-ratio:1;max-width:100%;max-height:100%;margin:auto;width:100%;border:4px solid var(--edge);border-radius:28px;background:var(--card);box-shadow:0 8px 0 var(--edge);display:grid;place-items:center;transition:transform .12s;position:relative;overflow:hidden}
@media (max-width:560px) and (orientation:portrait){.tile{aspect-ratio:auto;height:100%}}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 var(--edge)}
.tile .em{font-size:clamp(4rem,18vmin,9rem);line-height:1}
.tile svg.shape{width:62%;height:62%;max-height:62%}
.blob{width:68%;height:68%;max-height:68%;aspect-ratio:1;border-radius:46% 54% 50% 50%/52% 46% 54% 48%;border:4px solid var(--edge)}
.dots{display:flex;gap:6%;justify-content:center;align-items:center;width:84%;flex-wrap:wrap}
.dots i{width:24%;aspect-ratio:1;border-radius:50%;background:var(--berry);border:4px solid var(--edge)}
.tile.wrong{animation:wobble .45s}
.tile.right{animation:pop .5s;background:var(--sun)}
.tile.dim{opacity:.35}
@keyframes wobble{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes pop{40%{transform:scale(1.12)}100%{transform:scale(1)}}

.stars{display:flex;justify-content:center;gap:6px;min-height:2rem;font-size:1.6rem}
.stars span{animation:pop .4s}
.foot{text-align:center;color:var(--soft);font-size:.8rem}

#start{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;z-index:5;text-align:center}
#start h2{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,10vw,4.5rem);margin:0;line-height:1}
#start p{margin:0;max-width:34ch;color:var(--soft);font-size:1rem}
#go{width:9rem;height:9rem;border-radius:50%;border:5px solid var(--edge);background:var(--leaf);box-shadow:0 8px 0 var(--edge);display:grid;place-items:center;animation:breathe 1.8s ease-in-out infinite}
#go svg{width:4rem;height:4rem;fill:#fff;margin-left:8px}
@keyframes breathe{50%{transform:scale(1.06)}}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:4;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="start">
  <h2>Tap and Find</h2>
  <p>A grown-up starts the game. Each round asks your little one to find one thing — an animal, a colour, a shape or a number — and says it out loud. Turn the sound on.</p>
  <button id="go" aria-label="Start playing"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></button>
</div>

<nav class="worlds" aria-label="What to learn">
  <button class="world" data-w="animals" aria-pressed="true">🐮 Animals</button>
  <button class="world" data-w="colors" aria-pressed="false">🎨 Colours</button>
  <button class="world" data-w="shapes" aria-pressed="false">🔺 Shapes</button>
  <button class="world" data-w="numbers" aria-pressed="false">✋ Numbers</button>
</nav>

<div class="prompt">
  <h1 id="ask">Find the cow!</h1>
  <button class="say" id="again" aria-label="Say it again"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></button>
</div>

<main class="board" id="board"></main>
<div class="stars" id="stars" aria-live="polite"></div>
<div class="foot">Tap the speaker to hear it again · 2 choices to start, 3 after a few wins</div>
<canvas id="fx"></canvas>

<a href="./" style="position:fixed;z-index:9;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);font-family:'Baloo 2','Arial Rounded MT Bold',sans-serif;font-weight:800;font-size:16px;color:#2b1d12;background:#fff6e3;border:3px solid #2b1d12;border-radius:999px;padding:6px 14px;text-decoration:none;opacity:.92">⌂ Home</a>
<script>
const ANIMALS=[
 {k:"cow",e:"🐮",s:"Moo!"},{k:"dog",e:"🐶",s:"Woof woof!"},{k:"cat",e:"🐱",s:"Meow!"},
 {k:"duck",e:"🦆",s:"Quack quack!"},{k:"sheep",e:"🐑",s:"Baa!"},{k:"pig",e:"🐷",s:"Oink oink!"},
 {k:"lion",e:"🦁",s:"Roar!"},{k:"frog",e:"🐸",s:"Ribbit!"},{k:"chicken",e:"🐔",s:"Cluck cluck!"},
 {k:"horse",e:"🐴",s:"Neigh!"},{k:"elephant",e:"🐘",s:"Pawoo!"},{k:"camel",e:"🐪",s:"Hrumph!"},
 {k:"fish",e:"🐟",s:"Blub blub!"},{k:"bee",e:"🐝",s:"Buzz buzz!"},{k:"monkey",e:"🐵",s:"Ooh ooh ah ah!"}
];
const COLORS=[
 {k:"red",c:"#E8323C"},{k:"blue",c:"#2E7BF0"},{k:"yellow",c:"#FFD21F"},{k:"green",c:"#2DB86A"},
 {k:"orange",c:"#FF8A1F"},{k:"purple",c:"#8B4FD9"},{k:"pink",c:"#FF77B8"}
];
const SHAPES=[
 {k:"circle",d:'<circle cx="50" cy="50" r="42"/>',c:"#E8476A"},
 {k:"square",d:'<rect x="10" y="10" width="80" height="80" rx="6"/>',c:"#3E8EF7"},
 {k:"triangle",d:'<path d="M50 8 94 88H6z" stroke-linejoin="round"/>',c:"#3FBF7F"},
 {k:"star",d:'<path d="M50 6l12.9 27.4 30 3.7-22 20.7 5.6 29.8L50 73 23.5 87.6l5.6-29.8-22-20.7 30-3.7z" stroke-linejoin="round"/>',c:"#FFC83D"},
 {k:"heart",d:'<path d="M50 88S8 62 8 34a20 20 0 0 1 42-8 20 20 0 0 1 42 8c0 28-42 54-42 54z" stroke-linejoin="round"/>',c:"#FF77B8"}
];
const NUMBERS=[{k:"one",n:1},{k:"two",n:2},{k:"three",n:3},{k:"four",n:4}];
const PRAISE=["Yay!","Well done!","Great job!","You found it!","Super!","Hooray!"];

let world="animals", target=null, wins=0, busy=false, last=null;
const board=document.getElementById("board"), ask=document.getElementById("ask"), stars=document.getElementById("stars");

function speak(t){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.85;u.pitch=1.25;s.speak(u)}catch(e){}}
let ac;function tone(f,d,type="sine",when=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+when;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
function chime(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,"triangle",i*.09))}
function boop(){tone(220,.2,"sine")}

function pool(){return {animals:ANIMALS,colors:COLORS,shapes:SHAPES,numbers:NUMBERS}[world]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function phrase(it){
  if(world==="animals")return "Find the "+it.k+"!";
  if(world==="colors")return "Find "+it.k+"!";
  if(world==="shapes")return "Find the "+it.k+"!";
  return "Find "+it.k+"!";
}
function face(it){
  if(world==="animals")return `<span class="em" aria-hidden="true">${it.e}</span>`;
  if(world==="colors")return `<div class="blob" style="background:${it.c}"></div>`;
  if(world==="shapes")return `<svg class="shape" viewBox="0 0 100 100" aria-hidden="true"><g fill="${it.c}" stroke="var(--edge)" stroke-width="5">${it.d}</g></svg>`;
  return `<div class="dots">${"<i></i>".repeat(it.n)}</div>`;
}
function round(){
  busy=false;
  const n=wins>=4?3:2;
  let p=shuffle(pool()); if(last&&p[0].k===last)p.push(p.shift());
  const choices=p.slice(0,n); target=choices[0]; last=target.k;
  const order=shuffle(choices);
  board.style.setProperty("--n",n);
  board.innerHTML="";
  order.forEach(it=>{
    const b=document.createElement("button");b.className="tile";b.setAttribute("aria-label",it.k);b.innerHTML=face(it);
    b.onclick=()=>pick(b,it);board.appendChild(b);
  });
  ask.textContent=phrase(target);
  speak(phrase(target));
}
function pick(b,it){
  if(busy)return;
  if(it.k===target.k){
    busy=true;b.classList.add("right");
    [...board.children].forEach(x=>{if(x!==b)x.classList.add("dim")});
    chime();burst(b);
    const pr=PRAISE[Math.random()*PRAISE.length|0];
    let line=pr+" ";
    if(world==="animals")line+=`The ${it.k} says ${it.s}`;
    else if(world==="colors")line+=`That's ${it.k}!`;
    else if(world==="shapes")line+=`That's a ${it.k}!`;
    else line+=Array.from({length:it.n},(_,i)=>["One","two","three","four"][i]).join(", ")+"!";
    ask.textContent=pr;speak(line);
    wins++;addStar();
    setTimeout(round,world==="numbers"?3200:2600);
  }else{
    b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");boop();
    speak(world==="animals"?`That's a ${it.k}. ${phrase(target)}`:`Try again! ${phrase(target)}`);
  }
}
function addStar(){
  const marks=["⭐","🌟","💛","🎈","🌈"];
  if(stars.children.length>=10)stars.innerHTML="";
  const s=document.createElement("span");s.textContent=marks[wins%marks.length];stars.appendChild(s);
}

const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],raf=0;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",size);size();
function burst(el){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const r=el.getBoundingClientRect(),x=(r.left+r.width/2)*devicePixelRatio,y=(r.top+r.height/2)*devicePixelRatio;
  const cols=["#FFC83D","#3FBF7F","#3E8EF7","#E8476A","#8B4FD9"];
  for(let i=0;i<60;i++){const a=Math.random()*Math.PI*2,v=(4+Math.random()*9)*devicePixelRatio;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-6*devicePixelRatio,s:(6+Math.random()*8)*devicePixelRatio,c:cols[i%5],l:70,r:Math.random()*6})}
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45*devicePixelRatio;p.vx*=.98;p.l--;p.r+=.2;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.max(0,p.l/70);cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()});
  parts=parts.filter(p=>p.l>0);
  raf=parts.length?requestAnimationFrame(loop):0;if(!parts.length)cx.clearRect(0,0,cv.width,cv.height);
}

document.querySelectorAll(".world").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".world").forEach(x=>x.setAttribute("aria-pressed",x===b));
  world=b.dataset.w;wins=0;last=null;stars.innerHTML="";round();
});
document.getElementById("again").onclick=()=>speak(phrase(target));
document.getElementById("go").onclick=()=>{
  document.getElementById("start").hidden=true;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
  round();
};
(function(){const n=2;target=ANIMALS[0];board.style.setProperty("--n",n);
  [ANIMALS[0],ANIMALS[1]].forEach(it=>{const b=document.createElement("button");b.className="tile";b.innerHTML=face(it);b.onclick=()=>pick(b,it);board.appendChild(b)})})();
</script>

</body></html>
